          EXPECTED="$(sha256sum dist-beget/public_html/downloads/GENESIS-Android-Native-2.9.1.apk | cut -d' ' -f1)"
          # Hostinger CDN propagation can briefly retain the preceding release.
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/android-update.json?deploy=$GITHUB_SHA" \
