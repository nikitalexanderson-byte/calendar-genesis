name: Deploy GENESIS

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: genesis-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCTION_ORIGIN: ${{ vars.GENESIS_DEPLOY_TARGET == 'hostinger' && 'https://genesiscalendar.com' || 'https://genesiscalendar.ru' }}
      PLAY_BUNDLE_ARTIFACT: genesis-play-2.9.1
      # Set the repository variable to false for website-only deployments.
      # Unset it or set it to true to resume the existing Android release flow.
      DEPLOY_ANDROID: ${{ vars.GENESIS_DEPLOY_ANDROID != 'false' }}
      # Personal mindmaps can be disabled on the next web deployment without deleting data.
      GENESIS_MINDMAPS: ${{ vars.GENESIS_MINDMAPS == 'true' }}
      NEXT_PUBLIC_GENESIS_MINDMAPS: ${{ vars.GENESIS_MINDMAPS == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate production destination
        env:
          GENESIS_DEPLOY_TARGET: ${{ vars.GENESIS_DEPLOY_TARGET }}
        run: |
          test "$GENESIS_DEPLOY_TARGET" = hostinger || {
            echo 'GENESIS_DEPLOY_TARGET must explicitly select hostinger.' >&2
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check PHP syntax
        run: find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test native Google token verification
        run: |
          php server/tests/native-auth.php
          php server/tests/relocation.php
          php -l public/legacy-home.php
          php server/tests/legacy-home.php
          php server/tests/android-support.php
          php server/tests/web-asset-retention.php

      - name: Test PHP backend with isolated SQLite
        env:
          GENESIS_SMOKE_ROOT: ${{ runner.temp }}/genesis-backend-smoke
        run: |
          set -euo pipefail

          if [ -e server/config.php ]; then
            printf 'Refusing to overwrite an existing server/config.php.\n' >&2
            exit 1
          fi

          cleanup() {
            rm -f server/config.php
            rm -rf "$GENESIS_SMOKE_ROOT"
          }
          trap cleanup EXIT

          rm -rf "$GENESIS_SMOKE_ROOT"
          mkdir -p "$GENESIS_SMOKE_ROOT/sessions"

          php -r '
            foreach (["pdo_sqlite", "sodium", "mbstring"] as $extension) {
              if (!extension_loaded($extension)) {
                fwrite(STDERR, "Missing PHP extension: {$extension}\n");
                exit(1);
              }
            }
          '

          GENESIS_SMOKE_KEY="$(php -r 'echo base64_encode(random_bytes(32));')"
          export GENESIS_SMOKE_KEY
          php -r '
            $root = getenv("GENESIS_SMOKE_ROOT");
            $key = getenv("GENESIS_SMOKE_KEY");
            if (!is_string($root) || $root === "" || !is_string($key) || $key === "") {
              fwrite(STDERR, "Smoke test environment is incomplete.\n");
              exit(1);
            }
            $config = [
              "app_url" => "https://localhost.invalid",
              "google_client_id" => "",
              "google_client_secret" => "",
              "gigachat_enabled" => false,
              "gigachat_authorization_key" => "",
              "gemini_enabled" => false,
              "gemini_api_key" => "",
              "crypto_key" => $key,
              "db_path" => $root . "/genesis.sqlite",
              "session_path" => $root . "/sessions",
              "cookie_secure" => false,
              "timezone" => "Europe/Moscow",
              "admin_email" => "nikitalexanderson@gmail.com",
            ];
            $payload = "<?php\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n";
            if (file_put_contents("server/config.php", $payload, LOCK_EX) === false) {
              fwrite(STDERR, "Could not create the isolated smoke configuration.\n");
              exit(1);
            }
          '

          php server/tests/google-sync-cache.php
          php server/tests/calendar.php
          php server/tests/template-dates.php
          php server/tests/recurrence.php
          php server/tests/google-calendar-context.php
          php server/tests/google-incremental.php
          php server/tests/shared-content-storage.php
          php server/tests/smoke.php
          php server/tests/shared-projects.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-project-access.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-custom-fields.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/template-manifest.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/template-apply.php
          php server/tests/templates-migration.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-automations.php
          php server/tests/automations-migration.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-data-exchange.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-data-access.php
          php server/tests/data-exchange-migration.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-reports-history.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-reports.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-reports-integration.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-planning.php
          php server/tests/shared-sprint-flow-model.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-sprint-reports.php
          php server/tests/planning-migration.php
          GENESIS_IMPROVEMENTS_TEST=isolated php server/tests/shared-workflows.php
          php server/tests/workflows-migration.php
          php server/tests/shared-task-details.php
          php server/tests/shared-task-details-migration.php
          php server/tests/shared-task-lifecycle.php
          php server/tests/shared-series.php
          php server/tests/shared-series-migration.php
          php server/tests/shared-views.php
          php server/tests/shared-views-migration.php
          php server/tests/shared-bulk.php
          php server/tests/shared-bulk-migration.php
          php server/tests/shared-notifications.php
          php server/tests/habit-reminders.php
          php server/tests/habit-reminders-migration.php
          php server/tests/account-email.php
          php server/tests/account-email-migration.php
          php server/tests/calendar-exploration.php
          php server/tests/shared-task-display.php
          php server/tests/shared-calendar-previews.php
          php server/tests/shared-notifications-migration.php
          php server/tests/workspace-writer.php
          php server/tests/workspace-writer-migration.php
          php server/tests/sacred-feature-visibility.php
          php server/tests/client-activity.php
          php server/tests/client-activity-migration.php
          php server/tests/web-push.php
          php server/tests/shared-bulk-large.php
          php server/tests/shared-ui.php
          php server/tests/shared-space-settings.php
          php server/tests/private-invitations-migration.php

      - name: Test
        run: pnpm test

      - name: Test personal mindmaps with isolated SQLite
        env:
          GENESIS_MINDMAPS_TEST: isolated
        run: |
          set -euo pipefail
          test ! -e server/config.php
          trap 'rm -f server/config.php' EXIT
          php scripts/mindmaps/fixture.php a > /dev/null
          php server/tests/mindmaps.php
          php server/tests/mindmaps-google-contract.php
          php server/tests/mindmaps-native-contract.php
          php server/tests/mindmaps-migration.php
          php server/tests/subscriptions.php
          php server/tests/subscription-profile.php
          php server/tests/shared-mindmaps.php

      - name: Build client for Beget
        run: pnpm build:beget

      - name: Set up Java for native Android release
        if: env.DEPLOY_ANDROID == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        if: env.DEPLOY_ANDROID == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build signed native Android APK and Play bundle
        if: env.DEPLOY_ANDROID == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.GENESIS_ANDROID_RELEASE_KEYSTORE_B64 }}
          GENESIS_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_ANDROID_RELEASE_STORE_PASSWORD }}
          GENESIS_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_ANDROID_RELEASE_KEY_ALIAS }}
          GENESIS_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_ANDROID_RELEASE_KEY_PASSWORD }}
          GENESIS_YANDEX_CLIENT_ID: ${{ secrets.GENESIS_YANDEX_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Hosted Ubuntu also ships .NET and Swift; this Java/Node/PHP release
          # never uses them. Reclaim them before the build so the later AVD
          # has space for both its downloaded image and userdata partition.
          du -sh /usr/share/dotnet /usr/share/swift || true
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift
          df -h .
          test -n "$SIGNING_KEYSTORE_B64"
          test -n "$GENESIS_ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$GENESIS_ANDROID_SIGNING_KEY_ALIAS"
          test -n "$GENESIS_ANDROID_SIGNING_KEY_PASSWORD"
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
          umask 077
          mkdir -p "$RUNNER_TEMP/genesis-signing" dist-beget/public_html/downloads
          export GENESIS_ANDROID_SIGNING_STORE="$RUNNER_TEMP/genesis-signing/release.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$GENESIS_ANDROID_SIGNING_STORE"
          export GENESIS_YANDEX_CLIENT_ID=""
          (cd android && bash ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundlePlay :app:assemblePlay \
            --no-daemon --console=plain --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8')
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | grep -qi 'certificate SHA-256 digest: 1e161d36f574b0560d808c7ee95e1abe98165b3385336d0276fb381dfd901cb8'
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | grep -qi 'certificate SHA-1 digest: 9a28ae70b1933d86ff3a4ef931e924f81a4426bc'
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" \
            | grep -q "package: name='ru.genesis.calendar' versionCode='96' versionName='2.9.1'"
          cp "$APK" dist-beget/public_html/downloads/GENESIS-Android-Native-2.9.1.apk
          APK_SHA="$(sha256sum dist-beget/public_html/downloads/GENESIS-Android-Native-2.9.1.apk | cut -d' ' -f1)"
          printf '{"versionCode":96,"versionName":"2.9.1","minimumSupportedVersionCode":76,"minimumSupportedVersionName":"2.7.0","sha256":"%s"}\n' "$APK_SHA" \
            > dist-beget/public_html/android-update.json
          # Signing inputs stay private; only the published download is readable by HTTP.
          chmod 755 dist-beget/public_html/downloads
          chmod 644 dist-beget/public_html/downloads/GENESIS-Android-Native-2.9.1.apk dist-beget/public_html/android-update.json
          sha256sum dist-beget/public_html/downloads/GENESIS-Android-Native-2.9.1.apk

          AAB=android/app/build/outputs/bundle/play/app-play.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" | grep -q 'jar verified'
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' \
            android/app/build/intermediates/merged_manifest/play/processPlayMainManifest/AndroidManifest.xml
          # Keep the verified Console bundle with the release even when GitHub
          # delays artifact-quota recalculation. The APK download route stays unchanged.
          cp "$AAB" dist-beget/public_html/downloads/GENESIS-Android-Play-2.9.1.aab
          (cd dist-beget/public_html/downloads && sha256sum GENESIS-Android-Play-2.9.1.aab \
            > GENESIS-Android-Play-2.9.1.aab.sha256)
          chmod 644 dist-beget/public_html/downloads/GENESIS-Android-Play-2.9.1.aab*

      - name: Reclaim unused build tools for the release emulator
        if: env.DEPLOY_ANDROID == 'true'
        run: |
          # Signing, native symbol stripping and unit tests have completed.
          # The emulator needs the full system-image userdata partition even
          # when a smaller disk-size is requested. NDK tools are unused below.
          mapfile -t RELEASE_UNUSED_NDKS < <(sdkmanager --list_installed | awk -F'|' '/^[[:space:]]*ndk;/ {gsub(/[[:space:]]/, "", $1); print $1}')
          if [ "${#RELEASE_UNUSED_NDKS[@]}" -gt 0 ]; then
            sdkmanager --uninstall "${RELEASE_UNUSED_NDKS[@]}"
          fi
          # No Gradle tasks run after this point. Keep signed outputs and reports,
          # but release compilation scratch data before downloading the system
          # image and allocating its ~10 GB userdata partition.
          rm -rf -- android/app/build/intermediates android/app/build/tmp "$HOME/.gradle/caches"
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/apk/play/app-play.apk
          test -s android/app/build/outputs/bundle/play/app-play.aab
          df -h .
          test "$(df --output=avail . | tail -1 | tr -d ' ')" -ge 18874368

      - name: Enable KVM for release startup validation
        if: env.DEPLOY_ANDROID == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate signed release APK startup before publishing
        if: env.DEPLOY_ANDROID == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 8192M
          emulator-boot-timeout: 300
          script: |
            bash scripts/check-android-release-startup.sh android/app/build/outputs/apk/release/app-release.apk native-release
            bash scripts/check-android-release-classes.sh android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/mapping/release/mapping.txt native-release
            bash scripts/check-android-release-startup.sh android/app/build/outputs/apk/play/app-play.apk play-release
            bash scripts/check-android-release-classes.sh android/app/build/outputs/apk/play/app-play.apk android/app/build/outputs/mapping/play/mapping.txt play-release

      - name: Check whether the signed Play App Bundle is already saved
        id: play-bundle
        if: env.DEPLOY_ANDROID == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/play/app-play.aab
          test -s "$AAB"
          ARTIFACT_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | jq -r --arg name "$PLAY_BUNDLE_ARTIFACT" \
              '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty')"
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              > "$RUNNER_TEMP/genesis-latest-play.zip"
            unzip -p "$RUNNER_TEMP/genesis-latest-play.zip" app-play.aab \
              > "$RUNNER_TEMP/genesis-latest-play.aab"
            SAVED_SHA="$(sha256sum "$RUNNER_TEMP/genesis-latest-play.aab" | cut -d' ' -f1)"
            BUILT_SHA="$(sha256sum "$AAB" | cut -d' ' -f1)"
            if [ "$SAVED_SHA" = "$BUILT_SHA" ]; then
              echo 'upload=false' >> "$GITHUB_OUTPUT"
              printf 'Play App Bundle is unchanged; existing artifact %s contains the verified bundle.\n' \
                "$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'upload=true' >> "$GITHUB_OUTPUT"

      - name: Save signed Play App Bundle for Console upload
        id: save-play-bundle
        if: env.DEPLOY_ANDROID == 'true' && steps.play-bundle.outputs.upload == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLAY_BUNDLE_ARTIFACT }}
          path: android/app/build/outputs/bundle/play/app-play.aab
          if-no-files-found: error
          retention-days: 14

      - name: Report Play bundle artifact fallback
        if: env.DEPLOY_ANDROID == 'true' && steps.save-play-bundle.outcome == 'failure'
        run: |
          echo '::notice::GitHub artifact storage is unavailable; the verified Play bundle will be published with this release on GENESIS.'
          printf 'Play Console bundle mirror: %s/downloads/GENESIS-Android-Play-2.9.1.aab\n' "$PRODUCTION_ORIGIN" >> "$GITHUB_STEP_SUMMARY"

      # PHP-роутер должен физически лежать в public_html/api. Добавляем его в
      # единый public artifact, чтобы rsync --delete не создавал окно с 404.
      - name: Assemble public artifact and deployment metadata
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p dist-beget/public_html/api
          cp -a server/public/api/. dist-beget/public_html/api/
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"commit":"%s","runId":"%s","deployedAt":"%s"}\n' \
            "$DEPLOY_COMMIT" "$DEPLOY_RUN_ID" "$DEPLOYED_AT" \
            > dist-beget/public_html/deploy-meta.json

      - name: Load pinned GENESIS SSH host keys
        run: |
          install -m 600 ops/deploy-known-hosts "${{ runner.temp }}/genesis-deploy-known-hosts"
          ssh-keygen -F '[82.198.232.224]:65002' -f "${{ runner.temp }}/genesis-deploy-known-hosts" >/dev/null
          ssh-keygen -F haiirodw.beget.tech -f "${{ runner.temp }}/genesis-deploy-known-hosts" >/dev/null

      - name: Install backup helper and back up runtime state
        if: vars.GENESIS_DEPLOY_TARGET != 'hostinger'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/genesis-deploy-known-hosts, -o GlobalKnownHostsFile=/dev/null, -o UpdateHostKeys=no"
          SOURCE: "ops/"
          TARGET: "/home/h/haiirodw/genesis-calendar/ops/"
          ARGS: "-rlztvO --delete"
          SCRIPT_AFTER: |
            set -eu
            ROOT=/home/h/haiirodw/genesis-calendar
            PHP=/usr/local/php/cgi/8.3/bin/php
            test -d "$ROOT/public_html"
            test -d "$ROOT/server"
            "$PHP" -l "$ROOT/ops/backup-runtime.php" >/dev/null
            "$PHP" "$ROOT/ops/backup-runtime.php" \
              --server-root="$ROOT/server" \
              --backup-root="$ROOT/backups" \
              --retain=20
          SCRIPT_AFTER_REQUIRED: true

      - name: Deploy server code (excluding secrets and runtime data)
        if: vars.GENESIS_DEPLOY_TARGET != 'hostinger'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/genesis-deploy-known-hosts, -o GlobalKnownHostsFile=/dev/null, -o UpdateHostKeys=no"
          SOURCE: "server/"
          TARGET: "/home/h/haiirodw/genesis-calendar/server/"
          ARGS: "-rlztvO --delete"
          EXCLUDE: "config.php, config.example.php, var/, .git/"

      - name: Deploy public artifact (client and API router)
        if: vars.GENESIS_DEPLOY_TARGET != 'hostinger'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/genesis-deploy-known-hosts, -o GlobalKnownHostsFile=/dev/null, -o UpdateHostKeys=no"
          SOURCE: "dist-beget/public_html/"
          TARGET: "/home/h/haiirodw/genesis-calendar/public_html/"
          ARGS: "-rlztvO --delete"
          EXCLUDE: ${{ env.DEPLOY_ANDROID != 'true' && 'downloads/, android-update.json' || '/downloads/GENESIS-Android-Native-2.9.0.apk, /downloads/GENESIS-Android-Play-2.9.0.aab, /downloads/GENESIS-Android-Play-2.9.0.aab.sha256' }}

      - name: Back up Hostinger runtime state
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: 82.198.232.224
          REMOTE_USER: u531952483
          REMOTE_PORT: 65002
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/genesis-deploy-known-hosts, -o GlobalKnownHostsFile=/dev/null, -o UpdateHostKeys=no"
          SOURCE: "ops/"
          TARGET: "/home/u531952483/domains/genesiscalendar.com/ops/"
          ARGS: "-rlztvO --delete"
          SCRIPT_AFTER: |
            set -eu
            ROOT=/home/u531952483/domains/genesiscalendar.com
            test -f "$ROOT/server/config.php"
            php "$ROOT/ops/backup-runtime.php" --server-root="$ROOT/server" --backup-root="$ROOT/backups" --retain=20
            # Remember the incumbent asset graph before replacing any public files.
            php "$ROOT/ops/retain-web-assets.php" --root="$ROOT"
          SCRIPT_AFTER_REQUIRED: true

      - name: Deploy private Hostinger server code
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: 82.198.232.224
          REMOTE_USER: u531952483
          REMOTE_PORT: 65002
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/genesis-deploy-known-hosts, -o GlobalKnownHostsFile=/dev/null, -o UpdateHostKeys=no"
          SOURCE: "server/"
          TARGET: "/home/u531952483/domains/genesiscalendar.com/server/"
          ARGS: "-rlztvO --delete"
          EXCLUDE: "config.php, config.example.php, var/, .git/"

      - name: Stage Hostinger immutable web assets
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: 82.198.232.224
          REMOTE_USER: u531952483
          REMOTE_PORT: 65002
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/genesis-deploy-known-hosts, -o GlobalKnownHostsFile=/dev/null, -o UpdateHostKeys=no"
          SOURCE: "dist-beget/public_html/assets/"
