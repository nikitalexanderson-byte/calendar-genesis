name: Deploy GENESIS

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: genesis-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCTION_ORIGIN: ${{ vars.GENESIS_DEPLOY_TARGET == 'hostinger' && 'https://genesiscalendar.com' || 'https://genesiscalendar.ru' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check PHP syntax
        run: find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test native Google token verification
        run: |
          php server/tests/native-auth.php
          php server/tests/relocation.php

      - name: Test PHP backend with isolated SQLite
        env:
          GENESIS_SMOKE_ROOT: ${{ runner.temp }}/genesis-backend-smoke
        run: |
          set -euo pipefail

          if [ -e server/config.php ]; then
            printf 'Refusing to overwrite an existing server/config.php.\n' >&2
            exit 1
          fi

          cleanup() {
            rm -f server/config.php
            rm -rf "$GENESIS_SMOKE_ROOT"
          }
          trap cleanup EXIT

          rm -rf "$GENESIS_SMOKE_ROOT"
          mkdir -p "$GENESIS_SMOKE_ROOT/sessions"

          php -r '
            foreach (["pdo_sqlite", "sodium", "mbstring"] as $extension) {
              if (!extension_loaded($extension)) {
                fwrite(STDERR, "Missing PHP extension: {$extension}\n");
                exit(1);
              }
            }
          '

          GENESIS_SMOKE_KEY="$(php -r 'echo base64_encode(random_bytes(32));')"
          export GENESIS_SMOKE_KEY
          php -r '
            $root = getenv("GENESIS_SMOKE_ROOT");
            $key = getenv("GENESIS_SMOKE_KEY");
            if (!is_string($root) || $root === "" || !is_string($key) || $key === "") {
              fwrite(STDERR, "Smoke test environment is incomplete.\n");
              exit(1);
            }
            $config = [
              "app_url" => "https://localhost.invalid",
              "google_client_id" => "",
              "google_client_secret" => "",
              "gigachat_enabled" => false,
              "gigachat_authorization_key" => "",
              "gemini_enabled" => false,
              "gemini_api_key" => "",
              "crypto_key" => $key,
              "db_path" => $root . "/genesis.sqlite",
              "session_path" => $root . "/sessions",
              "cookie_secure" => false,
              "timezone" => "Europe/Moscow",
              "admin_email" => "nikitalexanderson@gmail.com",
            ];
            $payload = "<?php\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n";
            if (file_put_contents("server/config.php", $payload, LOCK_EX) === false) {
              fwrite(STDERR, "Could not create the isolated smoke configuration.\n");
              exit(1);
            }
          '

          php server/tests/smoke.php
          php server/tests/shared-projects.php

      - name: Test
        run: pnpm test

      - name: Build client for Beget
        run: pnpm build:beget

      - name: Set up Java for native Android release
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build signed native Android APK and Play bundle
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.GENESIS_ANDROID_RELEASE_KEYSTORE_B64 }}
          GENESIS_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_ANDROID_RELEASE_STORE_PASSWORD }}
          GENESIS_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_ANDROID_RELEASE_KEY_ALIAS }}
          GENESIS_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_ANDROID_RELEASE_KEY_PASSWORD }}
          GENESIS_YANDEX_CLIENT_ID: ${{ secrets.GENESIS_YANDEX_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_B64"
          test -n "$GENESIS_ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$GENESIS_ANDROID_SIGNING_KEY_ALIAS"
          test -n "$GENESIS_ANDROID_SIGNING_KEY_PASSWORD"
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
          umask 077
          mkdir -p "$RUNNER_TEMP/genesis-signing" dist-beget/public_html/downloads
          export GENESIS_ANDROID_SIGNING_STORE="$RUNNER_TEMP/genesis-signing/release.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$GENESIS_ANDROID_SIGNING_STORE"
          export GENESIS_YANDEX_CLIENT_ID=""
          (cd android && bash ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundlePlay --no-daemon --console=plain)
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | grep -qi 'certificate SHA-256 digest: 1e161d36f574b0560d808c7ee95e1abe98165b3385336d0276fb381dfd901cb8'
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | grep -qi 'certificate SHA-1 digest: 9a28ae70b1933d86ff3a4ef931e924f81a4426bc'
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" \
            | grep -q "package: name='ru.genesis.calendar' versionCode='73' versionName='2.6.7'"
          cp "$APK" dist-beget/public_html/downloads/GENESIS-Android-Native-2.6.7.apk
          APK_SHA="$(sha256sum dist-beget/public_html/downloads/GENESIS-Android-Native-2.6.7.apk | cut -d' ' -f1)"
          printf '{"versionCode":73,"versionName":"2.6.7","sha256":"%s"}\n' "$APK_SHA" \
            > dist-beget/public_html/android-update.json
          sha256sum dist-beget/public_html/downloads/GENESIS-Android-Native-2.6.7.apk

          AAB=android/app/build/outputs/bundle/play/app-play.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" | grep -q 'jar verified'
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' \
            android/app/build/intermediates/merged_manifest/play/processPlayMainManifest/AndroidManifest.xml

      - name: Save signed Play App Bundle for Console upload
        uses: actions/upload-artifact@v4
        with:
          name: genesis-play-2.6.7
          path: android/app/build/outputs/bundle/play/app-play.aab
          if-no-files-found: error
          retention-days: 14

      # PHP-роутер должен физически лежать в public_html/api. Добавляем его в
      # единый public artifact, чтобы rsync --delete не создавал окно с 404.
      - name: Assemble public artifact and deployment metadata
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p dist-beget/public_html/api
          cp -a server/public/api/. dist-beget/public_html/api/
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"commit":"%s","runId":"%s","deployedAt":"%s"}\n' \
            "$DEPLOY_COMMIT" "$DEPLOY_RUN_ID" "$DEPLOYED_AT" \
            > dist-beget/public_html/deploy-meta.json

      - name: Install backup helper and back up runtime state
        if: vars.GENESIS_DEPLOY_TARGET != 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SOURCE: "ops/"
          TARGET: "/home/h/haiirodw/genesis-calendar/ops/"
          ARGS: "-rlztvO --delete"
          SCRIPT_AFTER: |
            set -eu
            ROOT=/home/h/haiirodw/genesis-calendar
            PHP=/usr/local/php/cgi/8.3/bin/php
            test -d "$ROOT/public_html"
            test -d "$ROOT/server"
            "$PHP" -l "$ROOT/ops/backup-runtime.php" >/dev/null
            "$PHP" "$ROOT/ops/backup-runtime.php" \
              --server-root="$ROOT/server" \
              --backup-root="$ROOT/backups" \
              --retain=20
          SCRIPT_AFTER_REQUIRED: true

      - name: Deploy server code (excluding secrets and runtime data)
        if: vars.GENESIS_DEPLOY_TARGET != 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SOURCE: "server/"
          TARGET: "/home/h/haiirodw/genesis-calendar/server/"
          ARGS: "-rlztvO --delete"
          EXCLUDE: "config.php, config.example.php, var/, .git/"

      - name: Deploy public artifact (client and API router)
        if: vars.GENESIS_DEPLOY_TARGET != 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SOURCE: "dist-beget/public_html/"
          TARGET: "/home/h/haiirodw/genesis-calendar/public_html/"
          ARGS: "-rlztvO --delete"

      - name: Back up Hostinger runtime state
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: 82.198.232.224
          REMOTE_USER: u531952483
          REMOTE_PORT: 65002
          SOURCE: "ops/"
          TARGET: "/home/u531952483/domains/genesiscalendar.com/ops/"
          ARGS: "-rlztvO --delete"
          SCRIPT_AFTER: |
            set -eu
            ROOT=/home/u531952483/domains/genesiscalendar.com
            test -f "$ROOT/server/config.php"
            php "$ROOT/ops/backup-runtime.php" --server-root="$ROOT/server" --backup-root="$ROOT/backups" --retain=20
          SCRIPT_AFTER_REQUIRED: true

      - name: Deploy private Hostinger server code
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: 82.198.232.224
          REMOTE_USER: u531952483
          REMOTE_PORT: 65002
          SOURCE: "server/"
          TARGET: "/home/u531952483/domains/genesiscalendar.com/server/"
          ARGS: "-rlztvO --delete"
          EXCLUDE: "config.php, config.example.php, var/, .git/"

      - name: Deploy Hostinger public client and API
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: 82.198.232.224
          REMOTE_USER: u531952483
          REMOTE_PORT: 65002
          SOURCE: "dist-beget/public_html/"
          TARGET: "/home/u531952483/domains/genesiscalendar.com/public_html/"
          ARGS: "-rlztvO --delete"

      - name: Verify production health and deployed commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if HEALTH="$(curl -fsS "$PRODUCTION_ORIGIN/api/health?run=${GITHUB_RUN_ID}")" && \
               META="$(curl -fsS "$PRODUCTION_ORIGIN/deploy-meta.json?run=${GITHUB_RUN_ID}")"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done
          printf '%s' "$HEALTH" | jq -e '.ok == true' >/dev/null
          ACTUAL_COMMIT="$(printf '%s' "$META" | jq -er '.commit')"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          printf 'Production commit: %s\n' "$ACTUAL_COMMIT"

      - name: Assemble compatibility files for the previous origin
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        run: |
          mkdir -p dist-legacy/server/src dist-legacy/server/cron dist-legacy/public_html/api dist-legacy/public_html/downloads
          cp server/src/relocation.php dist-legacy/server/src/
          cp server/cron/sync.php dist-legacy/server/cron/
          cp server/public/api/index.php dist-legacy/public_html/api/
          cp dist-beget/public_html/.htaccess dist-legacy/public_html/
          cp dist-beget/public_html/relocated.* dist-legacy/public_html/
          cp dist-beget/public_html/relocated-sw.js dist-legacy/public_html/
          cp dist-beget/public_html/android-update.json dist-legacy/public_html/
          cp dist-beget/public_html/downloads/*.apk dist-legacy/public_html/downloads/

      - name: Keep installed applications compatible with the previous origin
        if: vars.GENESIS_DEPLOY_TARGET == 'hostinger'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: haiirodw.beget.tech
          REMOTE_USER: haiirodw
          REMOTE_PORT: 22
          SOURCE: "dist-legacy/"
          TARGET: "/home/h/haiirodw/genesis-calendar/"
          ARGS: "-rlztvO"
          SCRIPT_BEFORE: |
            test -f /home/h/haiirodw/genesis-calendar/server/var/relocation.json
          SCRIPT_BEFORE_REQUIRED: true

      - name: Verify public native APK
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum dist-beget/public_html/downloads/GENESIS-Android-Native-2.6.7.apk | cut -d' ' -f1)"
          curl -fsSL --retry 3 "$PRODUCTION_ORIGIN/android-update.json" \
            | jq -e --arg sha "$EXPECTED" '.versionCode == 73 and .versionName == "2.6.7" and .sha256 == $sha' >/dev/null
          DOWNLOAD_REDIRECT="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            "$PRODUCTION_ORIGIN/api/android/download")"
          test "$DOWNLOAD_REDIRECT" = "302 $PRODUCTION_ORIGIN/downloads/GENESIS-Android-Native-2.6.7.apk"
          curl -fsSL --retry 3 "$PRODUCTION_ORIGIN/downloads/GENESIS-Android-Native-2.6.7.apk" \
            | sha256sum \
            | awk -v expected="$EXPECTED" '$1 == expected { found = 1 } END { exit !found }'

# Примечания:
# - server/config.php и server/var/ (SQLite, сессии) никогда не перезаписываются —
#   исключены явно, плюс на сервере они и так вне git (.gitignore).
# - Перед выкладкой создаётся согласованная runtime-копия config.php + SQLite;
#   отслеживаемый код отдельно не копируется, потому что его история хранится в Git.
# - Миграции из server/migrations/ применяются приложением при первом обращении к БД.
# - После переноса cron выполняется на Hostinger; маркер на Beget блокирует
#   старый cron до открытия БД. Расписание настраивается отдельно.
