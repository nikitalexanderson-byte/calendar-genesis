            "https://genesiscalendar.ru/sw.js?deploy=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          test "$ACTUAL_WORKER" = "$EXPECTED_WORKER"
          REDIRECT="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            'https://genesiscalendar.ru/calendar?migration_check=1&lang=ru')"
          test "$REDIRECT" = '302 https://genesiscalendar.com/calendar?migration_check=1&lang=ru'
          curl -fsS --retry 3 'https://genesiscalendar.ru/api/health' | jq -e '.ok == true' >/dev/null

