               META="$(curl -fsS "$PRODUCTION_ORIGIN/deploy-meta.json?run=${GITHUB_RUN_ID}")"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done
          printf '%s' "$HEALTH" | jq -e '.ok == true' >/dev/null
          ACTUAL_COMMIT="$(printf '%s' "$META" | jq -er '.commit')"
