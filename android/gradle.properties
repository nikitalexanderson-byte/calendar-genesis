# JDK argfiles on Windows use the native encoding. COMPAT avoids corrupting
# Cyrillic checkout paths in Gradle test-worker classpaths (no system change).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.overridePathCheck=true
